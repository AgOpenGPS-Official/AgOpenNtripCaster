version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: ntripcaster-postgres
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    networks:
      - ntripcaster_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Backend API
  backend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    container_name: ntripcaster-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ConnectionStrings__DefaultConnection: "Server=${DB_HOST};Port=${DB_PORT};Database=${DB_NAME};User Id=${DB_USER};Password=${DB_PASSWORD};"
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      Email__Smtp__Host: ${SMTP_HOST}
      Email__Smtp__Port: ${SMTP_PORT}
      Email__Smtp__Username: ${SMTP_USERNAME}
      Email__Smtp__Password: ${SMTP_PASSWORD}
      Email__Smtp__FromEmail: ${SMTP_FROM_EMAIL}
      Email__Smtp__FromName: ${SMTP_FROM_NAME}
      Email__Smtp__EnableTls: ${SMTP_ENABLE_TLS}
      Email__Smtp__EnableSsl: ${SMTP_ENABLE_SSL}
      Logging__LogLevel__Default: ${LOG_LEVEL}
      NTRIP_SERVER_PORT: ${NTRIP_SERVER_PORT}
      NTRIP_SERVER_HOST: ${NTRIP_SERVER_HOST}
    volumes:
      - ./logs:/app/logs
    ports:
      - "5000:5000"
      - "${NTRIP_SERVER_PORT}:${NTRIP_SERVER_PORT}"
    networks:
      - ntripcaster_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  # Frontend Web Server (Nginx)
  frontend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.frontend
    container_name: ntripcaster-frontend
    depends_on:
      - backend
    environment:
      API_URL: http://backend:5000
      VITE_API_URL: http://localhost:5000
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
      - "443:443"
    networks:
      - ntripcaster_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local

networks:
  ntripcaster_network:
    driver: bridge
