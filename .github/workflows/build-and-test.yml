name: Build and Test

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

env:
  DOTNET_VERSION: '9.0.x'
  NODE_VERSION: '20.x'

jobs:
  build-backend:
    name: Build Backend (.NET)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore AgOpenNtripCaster.Server/AgOpenNtripCaster.Server.csproj

      - name: Build
        run: dotnet build AgOpenNtripCaster.Server/AgOpenNtripCaster.Server.csproj --configuration Release --no-restore

      - name: Test
        run: dotnet test AgOpenNtripCaster.Server/AgOpenNtripCaster.Server.csproj --configuration Release --no-build --verbosity normal
        continue-on-error: true  # Continue even if no tests exist

  build-frontend:
    name: Build Frontend (React + TypeScript)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: AgOpenNtripCaster.Client/package-lock.json

      - name: Install dependencies
        working-directory: AgOpenNtripCaster.Client
        run: npm ci --legacy-peer-deps

      - name: Build
        working-directory: AgOpenNtripCaster.Client
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: AgOpenNtripCaster.Client/dist
          retention-days: 7

  build-docker:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Server Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./AgOpenNtripCaster.Server/Dockerfile
          push: false
          tags: agopenntripcaster-server:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Client Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./AgOpenNtripCaster.Client/Dockerfile
          push: false
          tags: agopenntripcaster-client:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  lint-and-format:
    name: Code Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: AgOpenNtripCaster.Client/package-lock.json

      - name: Install frontend dependencies
        working-directory: AgOpenNtripCaster.Client
        run: npm ci --legacy-peer-deps

      - name: Run TypeScript type check
        working-directory: AgOpenNtripCaster.Client
        run: npx tsc --noEmit
        continue-on-error: true

      - name: Run ESLint
        working-directory: AgOpenNtripCaster.Client
        run: npx eslint . --ext .ts,.tsx --max-warnings 50
        continue-on-error: true
