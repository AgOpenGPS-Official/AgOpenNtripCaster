# AgOpen Ntripcaster Docker Compose for Portainer
# This version builds images directly from GitHub
#
# IMPORTANT: In Portainer, choose the "Repository" deployment method:
# 1. Stacks → Add Stack → Select "Repository" tab
# 2. Repository URL: https://github.com/AgOpenGPS-Official/AgOpenNtripCaster.git
# 3. Compose path: docker-compose.portainer.yml
# 4. Branch: develop
# 5. Add environment variables (or upload .env file)
# 6. Deploy

name: ntripcaster

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: ntripcaster-postgres
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
    environment:
      POSTGRES_DB: ${DB_NAME:-ntripcaster_db}
      POSTGRES_USER: ${DB_USER:-ntripcaster}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # PostgreSQL port removed from public access - only accessible within Docker network
    # If you need external DB access for development, use SSH tunnel instead
    # ports:
    #   - "${DB_PORT_EXTERNAL:-5432}:5432"
    networks:
      - ntripcaster_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # Backend API (ASP.NET Core)
  backend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    image: agopen/ntripcaster-backend:${IMAGE_TAG:-latest}
    container_name: ntripcaster-backend
    depends_on:
      postgres:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-ntripcaster_db}
      DB_USER: ${DB_USER:-ntripcaster}
      DB_PASSWORD: ${DB_PASSWORD:-password}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_HOURS: ${JWT_EXPIRATION_HOURS:-24}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-AgOpen Ntripcaster}
      SMTP_ENABLED: ${SMTP_ENABLED:-false}
      LOG_LEVEL: ${LOG_LEVEL:-Information}
      NTRIP_PORT: ${NTRIP_PORT:-2101}
      SERVER_HOST: ${SERVER_HOST:-0.0.0.0}
    volumes:
      - ./deploy/logs:/app/logs
      - ./deploy/backups:/backups
    ports:
      # Backend API port removed - only accessible via NGINX reverse proxy (HTTPS)
      # This prevents direct unencrypted access to the API
      # - "${SERVER_PORT:-5000}:5000"
      - "${NTRIP_PORT:-2101}:2101"  # NTRIP must be public for RTK clients
    networks:
      - ntripcaster_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  # Frontend Build (React + Vite)
  frontend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.frontend
    image: agopen/ntripcaster-frontend:${IMAGE_TAG:-latest}
    container_name: ntripcaster-frontend-build
    volumes:
      - frontend-dist:/output
    restart: "no"

  # NGINX Web Server
  nginx:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.nginx
    image: agopen/ntripcaster-nginx:${IMAGE_TAG:-latest}
    container_name: ntripcaster-nginx
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - frontend-dist:/usr/share/nginx/html:ro
      - certbot-etc:/etc/letsencrypt:ro
      - certbot-var:/var/lib/letsencrypt:ro
      - certbot-webroot:/var/www/certbot:ro
    networks:
      - ntripcaster_network
    depends_on:
      - frontend
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pgrep nginx || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Certbot for SSL/TLS certificates (Let's Encrypt)
  certbot:
    image: certbot/certbot
    container_name: ntripcaster-certbot
    restart: "no"
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-var:/var/lib/letsencrypt
      - certbot-webroot:/var/www/certbot
    # Uncomment and configure for automatic certificate renewal
    # entrypoint: /bin/sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h & wait $${!}; done;"

volumes:
  postgres_data:
    driver: local
  frontend-dist:
  certbot-etc:
  certbot-var:
  certbot-webroot:

networks:
  ntripcaster_network:
    driver: bridge
