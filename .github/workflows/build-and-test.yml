name: Build and Test

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

env:
  DOTNET_VERSION: '9.0.x'
  NODE_VERSION: '20.x'

jobs:
  build-backend:
    name: Build Backend (.NET)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore AgOpenNtripCaster.Server/AgOpenNtripCaster.Server.csproj

      - name: Build
        run: dotnet build AgOpenNtripCaster.Server/AgOpenNtripCaster.Server.csproj --configuration Release --no-restore

      - name: Test
        run: dotnet test AgOpenNtripCaster.Server/AgOpenNtripCaster.Server.csproj --configuration Release --no-build --verbosity normal
        continue-on-error: true  # Continue even if no tests exist

  build-frontend:
    name: Build Frontend (React + TypeScript)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: AgOpenNtripCaster.Client/package-lock.json

      - name: Install dependencies
        working-directory: AgOpenNtripCaster.Client
        run: npm ci --legacy-peer-deps

      - name: Build
        working-directory: AgOpenNtripCaster.Client
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: AgOpenNtripCaster.Client/dist
          retention-days: 7

  build-docker:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    # Only run if Docker-related files changed
    if: |
      contains(github.event.head_commit.message, '[docker]') ||
      contains(github.event.head_commit.message, '[build-all]') ||
      github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2  # Need to fetch previous commit to detect changes

      - name: Check for Docker-related changes
        id: docker_changes
        run: |
          # Check if any Docker-related files changed
          CHANGED_FILES=$(git diff --name-only HEAD^ HEAD)

          if echo "$CHANGED_FILES" | grep -qE '^deploy/|^AgOpenNtripCaster\.(Server|Client)/'; then
            echo "docker_changed=true" >> $GITHUB_OUTPUT
            echo "Docker-related files changed, will build images"
          else
            echo "docker_changed=false" >> $GITHUB_OUTPUT
            echo "No Docker-related files changed, skipping Docker builds"
          fi

      - name: Set up Docker Buildx
        if: steps.docker_changes.outputs.docker_changed == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker image
        if: steps.docker_changes.outputs.docker_changed == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./deploy/Dockerfile.backend
          push: false
          tags: agopenntripcaster-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Frontend Docker image
        if: steps.docker_changes.outputs.docker_changed == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./deploy/Dockerfile.frontend
          push: false
          tags: agopenntripcaster-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Nginx Docker image
        if: steps.docker_changes.outputs.docker_changed == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./deploy/Dockerfile.nginx
          push: false
          tags: agopenntripcaster-nginx:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Skip Docker builds
        if: steps.docker_changes.outputs.docker_changed == 'false'
        run: echo "✅ Skipping Docker builds - no relevant changes detected"

  lint-and-format:
    name: Code Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: AgOpenNtripCaster.Client/package-lock.json

      - name: Install frontend dependencies
        working-directory: AgOpenNtripCaster.Client
        run: npm ci --legacy-peer-deps

      - name: Run TypeScript type check
        working-directory: AgOpenNtripCaster.Client
        run: npx tsc --noEmit
        continue-on-error: true

      - name: Run ESLint
        working-directory: AgOpenNtripCaster.Client
        run: npx eslint . --ext .ts,.tsx --max-warnings 50
        continue-on-error: true
