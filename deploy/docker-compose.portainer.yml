version: '3.8'

# AgOpen Ntripcaster Docker Compose for Portainer
# This version uses pre-built images and volume mounts
# Place your cloned repository at a known location (e.g., /opt/ntripcaster)
#
# Usage in Portainer:
# 1. Create a new stack
# 2. Paste this compose file
# 3. Set the "Repository URL" to your git repo (optional)
# 4. Deploy

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: ntripcaster-postgres
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - ntripcaster_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Backend API
  backend:
    # Option 1: Use pre-built image from registry
    image: agopen/ntripcaster-backend:${IMAGE_TAG:-latest}
    # Option 2: Build from source (uncomment if you have the repo mounted)
    # build:
    #   context: ./
    #   dockerfile: AgOpenNtripCaster.Server/Dockerfile
    container_name: ntripcaster-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ConnectionStrings__DefaultConnection: "Server=${DB_HOST};Port=${DB_PORT};Database=${DB_NAME};User Id=${DB_USER};Password=${DB_PASSWORD};"
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_HOURS: ${JWT_EXPIRATION_HOURS:-24}
      CORS_ORIGINS: ${CORS_ORIGINS}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME}
      SMTP_ENABLED: ${SMTP_ENABLED:-false}
      LOG_LEVEL: ${LOG_LEVEL:-Information}
      NTRIP_PORT: ${NTRIP_PORT:-2101}
      SERVER_HOST: ${SERVER_HOST:-0.0.0.0}
    volumes:
      - ntripcaster_logs:/app/logs
    ports:
      - "${SERVER_PORT:-5000}:5000"
      - "${NTRIP_PORT:-2101}:${NTRIP_PORT:-2101}"
    networks:
      - ntripcaster_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  # Frontend Web Server (Nginx)
  frontend:
    # Option 1: Use pre-built image from registry
    image: agopen/ntripcaster-frontend:${IMAGE_TAG:-latest}
    # Option 2: Build from source (uncomment if you have the repo mounted)
    # build:
    #   context: ./
    #   dockerfile: AgOpenNtripCaster.Client/Dockerfile
    container_name: ntripcaster-frontend
    depends_on:
      - backend
    environment:
      API_URL: http://backend:5000
      VITE_API_URL: http://localhost:5000
    ports:
      - "${WEB_PORT:-8080}:80"
      - "${WEB_PORT_SSL:-4433}:443"
    networks:
      - ntripcaster_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  ntripcaster_logs:
    driver: local

networks:
  ntripcaster_network:
    driver: bridge
