version: '3.8'

# AgOpen Ntripcaster Docker Compose for Portainer (GitHub Repository Deployment)
#
# This version is designed to work with Portainer's "Repository" option
# It will automatically clone from GitHub and build the images
#
# IMPORTANT: In Portainer, choose the "Repository" deployment method:
# 1. Stacks → Add Stack → Select "Repository" tab
# 2. Repository URL: https://github.com/AgOpenGPS-Official/AgOpenNtripCaster.git
# 3. Compose path: deploy/docker-compose.portainer.yml
# 4. Branch: develop
# 5. Add environment variables (or upload .env file)
# 6. Deploy

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: ntripcaster-postgres
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - ntripcaster_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Backend API
  backend:
    build:
      context: ..
      dockerfile: Dockerfile.backend
    image: agopen/ntripcaster-backend:${IMAGE_TAG:-latest}
    container_name: ntripcaster-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-ntripcaster_db}
      DB_USER: ${DB_USER:-ntripcaster}
      DB_PASSWORD: ${DB_PASSWORD:-password}
      ConnectionStrings__DefaultConnection: "Server=${DB_HOST:-postgres};Port=${DB_PORT:-5432};Database=${DB_NAME:-ntripcaster_db};User Id=${DB_USER:-ntripcaster};Password=${DB_PASSWORD:-password};"
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_HOURS: ${JWT_EXPIRATION_HOURS:-24}
      CORS_ORIGINS: ${CORS_ORIGINS}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME}
      SMTP_ENABLED: ${SMTP_ENABLED:-false}
      LOG_LEVEL: ${LOG_LEVEL:-Information}
      NTRIP_PORT: ${NTRIP_PORT:-2101}
      SERVER_HOST: ${SERVER_HOST:-0.0.0.0}
    ports:
      - "${SERVER_PORT:-5000}:5000"
      - "${NTRIP_PORT:-2101}:${NTRIP_PORT:-2101}"
    networks:
      - ntripcaster_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  # Frontend Web Server (Nginx)
  frontend:
    build:
      context: ..
      dockerfile: Dockerfile.frontend
    image: agopen/ntripcaster-frontend:${IMAGE_TAG:-latest}
    container_name: ntripcaster-frontend
    depends_on:
      - backend
    environment:
      API_URL: http://backend:5000
      VITE_API_URL: http://localhost:5000
    ports:
      - "${WEB_PORT:-8080}:80"
      - "${WEB_PORT_SSL:-4433}:443"
    networks:
      - ntripcaster_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local

networks:
  ntripcaster_network:
    driver: bridge
